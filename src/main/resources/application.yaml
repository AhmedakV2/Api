spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
  application:
    name: aft-api
  profiles:
    default: dev
  datasource:
    url: ${AFT_DB_URL}
    username: ${AFT_DB_USER}
    password: ${AFT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false
  ai:
    model:
      chat: ${AFT_AI_PROVIDER:ollama}
      embedding: ${AFT_AI_EMBEDDING_PROVIDER:ollama}
      image: none
      moderation: none
      audio:
        speech: none
    openai:
      base-url: ${FOALLM_BASE_URL:}
      api-key: ${FOALLM_API_KEY:}
      chat:
        options:
          model: ${FOALLM_MODEL:Akgun-Q3.6}
          temperature: ${FOALLM_TEMPERATURE:0.3}

server:
  port: ${AFT_SERVER_PORT:8092}
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
aft:
  cors:
    allowed-origins: ${AFT_CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${AFT_JWT_SECRET}
    access-ttl: ${AFT_JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${AFT_JWT_REFRESH_TTL:P30D}
    issuer: aft-api
  security:
    lockout:
      max-attempts: ${AFT_LOGIN_MAX_ATTEMPTS:5}
      duration: ${AFT_LOGIN_LOCK_DURATION:PT15M}
    rate-limit:
      anonymous-per-minute: ${AFT_RATE_ANON:20}
      authenticated-per-minute: ${AFT_RATE_AUTH:300}
      agent-per-minute: ${AFT_RATE_AGENT:30}
    ws-ticket-ttl: PT60S
  ai:
    provider: ${AFT_AI_PROVIDER:ollama}
    models:
      planner: ${AFT_AI_MODEL_PLANNER:llama3.1:8b}
      fast: ${AFT_AI_MODEL_FAST:llama3.1:8b}
      embedding: ${AFT_AI_EMBEDDING_MODEL:nomic-embed-text}
    request-timeout: ${AFT_AI_REQUEST_TIMEOUT:PT300S}
    max-window-messages: ${AFT_AI_MAX_WINDOW_MESSAGES:40}
    max-window-tokens: ${AFT_AI_MAX_WINDOW_TOKENS:24000}
    tool-timeout: ${AFT_AI_TOOL_TIMEOUT_MS:PT30S}
    max-tool-hops: ${AFT_AI_MAX_TOOL_HOPS:12}
    max-tool-result-bytes: ${AFT_AI_MAX_TOOL_RESULT_BYTES:262144}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    enabled: ${AFT_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${AFT_DOCS_ENABLED:true}
    path: /swagger-ui.html

logging:
  level:
    root: ${AFT_LOG_LEVEL:INFO}
    com.aft.api: ${AFT_LOG_LEVEL:DEBUG}
