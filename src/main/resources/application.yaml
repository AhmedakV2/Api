spring:
  application:
    name: aft-api
  profiles:
    default: dev
  datasource:
    url: ${AFT_DB_URL:jdbc:postgresql://localhost:5432/aft}
    username: ${AFT_DB_USER:aft}
    password: ${AFT_DB_PASSWORD:aft}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${AFT_REDIS_HOST:}
      port: 6379
      password: ${AFT_REDIS_PASSWORD:}
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
aft:
  cors:
    allowed-origins: ${AFT_CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${AFT_JWT_SECRET:}
    access-ttl: ${AFT_JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${AFT_JWT_REFRESH_TTL:P30D}
    issuer: aft-api
  security:
    lockout:
      max-attempts: ${AFT_LOGIN_MAX_ATTEMPTS:5}
      duration: ${AFT_LOGIN_LOCK_DURATION:PT15M}
    rate-limit:
      anonymous-per-minute: ${AFT_RATE_ANON:20}
      authenticated-per-minute: ${AFT_RATE_AUTH:300}
      agent-per-minute: ${AFT_RATE_AGENT:30}
    ws-ticket-ttl: PT60S
  ai:
    provider: ${AFT_AI_PROVIDER:ollama}
    models:
      planner: ${AFT_AI_MODEL_PLANNER:llama3.1:8b}
      fast: ${AFT_AI_MODEL_FAST:llama3.1:8b}
      embedding: ${AFT_AI_EMBEDDING_MODEL:nomic-embed-text}
    request-timeout: ${AFT_AI_REQUEST_TIMEOUT:PT120S}
    max-window-messages: ${AFT_AI_MAX_WINDOW_MESSAGES:40}
    max-window-tokens: ${AFT_AI_MAX_WINDOW_TOKENS:24000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${AFT_LOG_LEVEL:INFO}
    com.aft.api: ${AFT_LOG_LEVEL:DEBUG}
